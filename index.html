<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Equipment Information</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div id="equipmentPage">

      <div class="header">

        <div class="equipment-icon">
          ⚕
        </div>

        <div>
          <p class="label">HOSPITAL EQUIPMENT</p>

          <h1 id="equipmentName">
            Loading...
          </h1>

          <p id="equipmentId" class="equipment-id">
          </p>
        </div>

      </div>


      <div class="card">

        <h2>Equipment Details</h2>

        <div class="details">

          <div class="detail-item">
            <span>Category</span>
            <strong id="category">—</strong>
          </div>

          <div class="detail-item">
            <span>Brand</span>
            <strong id="brand">—</strong>
          </div>

          <div class="detail-item">
            <span>Model</span>
            <strong id="model">—</strong>
          </div>

          <div class="detail-item">
            <span>Asset Number</span>
            <strong id="assetNumber">—</strong>
          </div>

          <div class="detail-item">
            <span>Location</span>
            <strong id="location">—</strong>
          </div>

          <div class="detail-item">
            <span>Status</span>
            <strong id="status">—</strong>
          </div>

        </div>

      </div>


      <div class="footer">
        Equipment Information System
      </div>

    </div>


    <div id="notFound" class="card not-found">

      <div class="equipment-icon">
        ⚠
      </div>

      <h1>Equipment Not Found</h1>

      <p>
        The equipment ID in this QR code could not be found.
      </p>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
